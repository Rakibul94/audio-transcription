
[project]
name = "audio-transcription"
version = "0.1.0"
description = "Bilingual (bn/en) audio transcription service, CPU-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",   # required for UploadFile/Form even on FastAPI 0.115+
]

[project.optional-dependencies]
# The real model stack is OPTIONAL on purpose: the mock path installs and
# runs with none of it. Same philosophy as lazy-importing inside the adapter.
whisper = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",       # TestClient transport
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]       # lets tests do `from services.config import Settings`
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.setuptools]
packages = ["adapters", "api", "services"]